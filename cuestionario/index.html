@font-face{font-family:"Figtree";src:url("../fuentes/Figtree.woff2") format("woff2");font-weight:300 900;font-style:normal;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url("../fuentes/BodoniModa.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url("../fuentes/BodoniModa-cursiva.woff2") format("woff2");font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:"Gloock";src:url("fuentes/Gloock.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Young Serif";src:url("fuentes/YoungSerif.woff2") format("woff2");font-weight:400;font-display:swap}

<link rel="stylesheet" href="expediente.css">
<style>
:root{
  --marfil:#F3ECDD; --papel:#FAF6EC; --campo:#E9E0CC; --verde:#0F3B32; --verde2:#0A2B24; --negro:#1A1A1A; --suave:#4A4F48; --oro:#C9A35C; --linea:#D9CFBA; --borde:#B9AE97;
  --titulo:'Bodoni Moda', Georgia, serif; --texto:'Figtree', system-ui, sans-serif; --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--marfil);color:var(--negro);font:400 16px/1.55 var(--texto);-webkit-font-smoothing:antialiased}
p,figcaption{hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;-webkit-hyphenate-limit-before:3;-webkit-hyphenate-limit-after:3}
.j{text-align:justify}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--verde)}
img{display:block;max-width:100%}
.cabecera{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(16px,4vw) 14px;background:var(--verde)}
.cabecera img{height:20px;width:auto}
.cabecera .lema{font:italic 400 15px/1 var(--titulo);letter-spacing:.01em;color:#DCD5C3;white-space:nowrap}
.barra{height:2px;background:var(--verde)}
.barra i{display:block;height:2px;width:0;background:var(--oro);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.marco{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:clamp(32px,5vw,88px);padding:0 max(16px,4vw);min-height:calc(100vh - 130px)}
.marco.solo{grid-template-columns:minmax(0,1fr)}
.escena{padding:clamp(24px,5vh,56px) 0 80px;max-width:720px}
.escena.ancha{max-width:1324px}
.escena.entra{animation:entra .32s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.escena.entra,.dato.nuevo{animation:none}.barra i{transition:none}}
.arriba{display:flex;align-items:center;gap:14px;min-height:44px;margin:0 0 26px}
.cuadro{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);color:var(--negro);transition:background .15s,color .15s,border-color .15s}
.cuadro:hover{background:var(--verde);border-color:var(--verde);color:var(--marfil)}
.cuadro svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.signo{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--negro);border-radius:var(--r);transition:color .15s}
.signo svg{width:15px;height:19px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.signo:hover{color:var(--verde)}
.signo:focus-visible{outline-offset:-3px}
#volver{margin-left:-15px}
.paso{font:400 14px/1 var(--texto);color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
h1{font:400 clamp(30px,3.3vw,46px)/1.1 var(--titulo);letter-spacing:-.005em;margin:0 0 16px;text-wrap:balance}
h1:focus{outline:none}
h2{font:400 clamp(22px,2.2vw,28px)/1.18 var(--titulo);margin:0 0 12px}
.ayuda{font:400 16px/1.55 var(--texto);color:var(--suave);max-width:58ch;margin:0 0 30px;text-wrap:pretty}
.nota{color:var(--suave);font-size:14.5px;max-width:58ch;margin:18px 0 0}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:8px 24px;border:1px solid var(--verde);border-radius:var(--r);background:var(--verde);color:var(--marfil);font:500 15.5px/1.15 var(--texto);letter-spacing:.01em;text-decoration:none;text-align:center;transition:background-color .2s,border-color .2s,color .2s}
.boton:hover{background:var(--verde2);border-color:var(--verde2)}
.boton.sec{background:transparent;color:var(--verde)}
.boton.sec:hover{background:rgba(15,59,50,.07);border-color:var(--verde)}
.boton[disabled]{opacity:.35;cursor:not-allowed}
.boton.grande{min-height:56px;padding:8px 28px;font-size:17px}
.acciones{display:flex;align-items:center;gap:12px;margin-top:36px;flex-wrap:wrap}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;max-width:680px;margin:0 0 8px}
.opciones.una-col{grid-template-columns:minmax(0,1fr);max-width:560px}
.op{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 18px;border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);color:var(--negro);font:400 16.5px/1.3 var(--texto);text-align:left;transition:background .15s,color .15s,border-color .15s}
.op:hover{border-color:var(--verde)}
.op[aria-checked="true"],.op[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--marfil)}
.op > svg{width:22px;height:22px;flex:none}
.op .txt{flex:1}
.op .ej{font:400 19px/1.1 var(--titulo);color:var(--verde);white-space:nowrap}
.op[aria-pressed="true"] .ej{color:var(--oro)}
.op .orden{font:500 14px/1 var(--texto);font-variant-numeric:tabular-nums}
.caja{width:18px;height:18px;flex:none;border:1px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.caja svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
[aria-pressed="true"] .caja svg{opacity:1}
.op[aria-pressed="true"] .caja,.op[aria-pressed="true"] .orden{color:var(--oro)}
.palabras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:680px;margin:0 0 8px}
.palabras .op{min-height:50px;padding:10px 16px;font-size:16px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:0 0 8px}
.pieza{display:flex;flex-direction:column;border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);overflow:hidden;text-align:left;transition:border-color .15s}
.pieza:hover{border-color:var(--verde)}
.pieza .vista{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;padding:16px;text-align:center;line-height:1.05;overflow-wrap:anywhere;background:#FFFDF8;color:var(--negro);border-bottom:1px solid var(--linea)}
.pieza .vista img{width:100%;height:100%;object-fit:cover}
.pieza .pie{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;font:400 15px/1.3 var(--texto);transition:background .15s,color .15s}
.pieza[aria-pressed="true"]{border-color:var(--verde)}
.pieza[aria-pressed="true"] .pie{background:var(--verde);color:var(--marfil)}
.dos{display:inline-grid;grid-template-columns:1fr 1fr;margin:0 0 22px;border:1px solid var(--verde);border-radius:var(--r);overflow:hidden}
.dos button{min-height:48px;padding:10px 22px;font:500 15px/1.2 var(--texto);color:var(--verde);background:var(--papel);text-align:center}
.dos button[aria-selected="true"]{background:var(--verde);color:var(--marfil)}
.colores{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;max-width:680px}
.chip{display:flex;flex-direction:column;border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);overflow:hidden;text-align:left;transition:border-color .15s}
.chip:hover{border-color:var(--verde)}
.chip .tinta{display:block;aspect-ratio:4/3;box-shadow:inset 0 -1px 0 rgba(26,26,26,.1);transition:opacity .2s}
.chip .nom{display:block;font:400 14px/1.25 var(--texto);padding:8px 10px 2px}
.chip .estado{display:block;font:500 13px/1.2 var(--texto);padding:0 10px 9px;min-height:1.9em;color:var(--verde)}
.chip.si{border-color:var(--verde);background:var(--verde);color:var(--marfil)}
.chip.si .estado{color:var(--marfil)}
.chip.no .tinta{opacity:.28}
.chip.no .estado{color:var(--negro)}
.campo{display:block;margin:0 0 18px;max-width:620px}
.campo > span{display:block;font:500 15px/1.3 var(--texto);margin-bottom:8px}
.campo.sin > span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.campo input,.campo textarea{width:100%;font:400 18px/1.4 var(--texto);color:var(--negro);background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:14px 16px}
.campo textarea{min-height:130px;resize:vertical}
.campo input::placeholder,.campo textarea::placeholder{color:#6F695E}
.campo input:focus,.campo textarea:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde)}
.sub{margin-top:30px}
.sub > p{font:500 16px/1.3 var(--texto);margin:0 0 12px}
.sub > h2{margin:0 0 18px}
.oculto{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.privacidad{font-size:14px;color:var(--suave);max-width:60ch;margin-top:26px}
.acepto{display:flex;gap:12px;align-items:flex-start;font-size:15px;margin-top:14px;max-width:60ch;min-height:44px;cursor:pointer}
.acepto input{width:22px;height:22px;margin-top:1px;accent-color:var(--verde);flex:none}
.lam{position:relative;display:block;overflow:hidden;border-radius:2px;min-width:0}
.lam .llena{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.movil{position:relative;display:block;aspect-ratio:9/18.6;border:1px solid #151515;border-radius:24px;background:#151515;overflow:hidden;box-shadow:0 20px 44px rgba(10,24,20,.26)}
.movil > img,.movil > .vivaweb,.movil > .pant{position:absolute;inset:0;width:100%;height:100%;border-radius:23px;overflow:hidden}
.movil > img{object-fit:cover;object-position:50% 0}
.movil > .pant{display:grid;justify-items:center;align-content:center;padding:0 11%;background:var(--verde);color:var(--marfil);text-align:center}
.movil > .pant svg{display:block;width:58%;height:auto;margin-bottom:16%}
.pant .msj{font:400 clamp(17px,1.5vw,21px)/1.22 var(--titulo);text-wrap:balance}
.pant .fch{margin-top:11%;padding-top:11%;border-top:1px solid rgba(243,236,221,.3);font:400 12.5px/1.5 var(--texto);color:#DCD5C3}
.pant .fch b{display:block;font:400 15px/1.3 var(--texto);color:var(--marfil)}
.pant .fir{margin-top:6%;font:italic 400 13.5px/1.2 var(--titulo);color:#DCD5C3}
.ventana{display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid rgba(26,26,26,.16);border-bottom:0;border-radius:6px 6px 0 0;background:#fff;overflow:hidden;box-shadow:0 20px 44px rgba(10,24,20,.14)}
.ventana .dir{padding:9px 14px;border-bottom:1px solid rgba(26,26,26,.1);background:#F6F3EC;font:400 12.5px/1 var(--texto);color:var(--suave);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivaweb{position:relative;height:100%;min-height:0;overflow:hidden;background:#F6EEEC}
.vivaweb iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#F6EEEC}
.movil > .vivaweb{background:#F6EEEC url(img/web-nerea-movil.webp) 50% 0/100% auto no-repeat}
.movil > .vivaweb iframe{background:transparent}
.portada{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:center}
.portada h1{font-size:clamp(34px,3.8vw,52px);margin-bottom:6px}
.elige{display:inline-grid;gap:12px;margin-top:34px}
.contactos{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;margin-top:30px}
.contacto{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:8px 30px;border:1px solid var(--verde);border-radius:var(--r);background:var(--verde);color:var(--marfil);text-decoration:none;transition:background-color .2s,border-color .2s}
.contacto svg{width:22px;height:22px;flex:none;color:var(--oro)}
.contacto .nom{font:500 17px/1.15 var(--texto);letter-spacing:.01em}
.contacto:hover{background:var(--verde2);border-color:var(--verde2)}
.escaparate{margin:0;display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);gap:10px}
.escaparate .lam{height:clamp(400px,66vh,620px)}
.esc-foto .llena{object-position:47% 50%}
.esc-web{display:grid;place-items:center;background:var(--verde)}
.esc-web .movil{height:84%}
.escaparate figcaption{grid-column:2;margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--suave)}
.vivo .atomos circle,.entra .vivo-e .atomos circle{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);animation:atomo .5s cubic-bezier(.2,.7,.2,1) forwards}
.vivo .atomos circle:nth-child(1),.entra .vivo-e .atomos circle:nth-child(1){animation-delay:.1s}
.vivo .atomos circle:nth-child(2),.entra .vivo-e .atomos circle:nth-child(2){animation-delay:.19s}
.vivo .atomos circle:nth-child(3),.entra .vivo-e .atomos circle:nth-child(3){animation-delay:.28s}
.vivo .atomos circle:nth-child(4),.entra .vivo-e .atomos circle:nth-child(4){animation-delay:.37s}
.vivo .atomos circle:nth-child(5),.entra .vivo-e .atomos circle:nth-child(5){animation-delay:.46s}
.vivo .linea path,.entra .vivo-e .linea path{stroke-dasharray:1 2;stroke-dashoffset:1.05;animation:traza .95s cubic-bezier(.5,.05,.3,1) .6s forwards}
.vivo .linea path:nth-child(2),.entra .vivo-e .linea path:nth-child(2){animation-duration:.3s;animation-delay:1s}
.vivo .linea path:nth-child(3),.entra .vivo-e .linea path:nth-child(3){animation-duration:.25s;animation-delay:1.4s}
.vivo .palabra,.entra .vivo-e .palabra{opacity:0;animation:aparece .5s ease 1.45s forwards}
@keyframes traza{to{stroke-dashoffset:0}}
@keyframes atomo{to{opacity:1;transform:none}}
@keyframes aparece{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.vivo .linea path,.vivo .atomos circle,.vivo .palabra,.entra .vivo-e .linea path,.entra .vivo-e .atomos circle,.entra .vivo-e .palabra{animation:none!important;stroke-dashoffset:0;opacity:1;transform:none}}
.paquetes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.2vw,32px)}
.paquete{position:relative;display:flex;flex-direction:column;min-width:0;padding:10px 10px 18px;border:1px solid var(--linea);border-radius:var(--r);cursor:pointer;transition:border-color .15s}
.paquete:hover{border-color:var(--borde)}
.paquete[aria-checked="true"]{border-color:var(--verde)}
.paquete .lam{aspect-ratio:1/1.08}
.radio{position:absolute;top:22px;right:22px;z-index:1;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--verde);border-radius:50%;background:var(--papel)}
.radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--verde);transform:scale(0);transition:transform .15s}
[aria-checked="true"] > .radio::after{transform:none}
.p-kit{display:grid;grid-template-columns:58fr 19fr 9fr 14fr}
.p-kit .c{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.p-kit .c.v{background:var(--verde);color:var(--marfil)}
.p-kit .c.m{background:var(--marfil);color:var(--negro);align-items:flex-start;padding-top:22px;box-shadow:inset 0 1px 0 var(--borde),inset 0 -1px 0 var(--borde)}
.p-kit .c.o{background:var(--oro);color:var(--negro)}
.p-kit .c.n{background:var(--negro);color:var(--marfil)}
.p-kit .c.v > span:first-child{display:block;width:64%}
.p-kit .c.v svg{display:block;width:100%;height:auto}
.p-kit .ics{display:grid;justify-items:center;gap:14px}
.p-kit .c.m img{border-radius:22%}
.p-kit .cod{position:absolute;left:50%;bottom:16px;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:400 12px/1 var(--texto);letter-spacing:.04em;white-space:nowrap}
.p-kit .c.v .cod{left:20px;transform:rotate(180deg)}
.p-web{background:var(--campo)}
.p-web .movil{position:absolute;left:50%;top:9%;width:54%;transform:translateX(-50%)}
.paquete .cuerpo{display:flex;flex-direction:column;gap:6px;padding:18px 6px 0;flex:1}
.paquete .fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.paquete .nombre{font:400 25px/1.15 var(--titulo)}
.paquete .nombre .mas{font:300 .82em/1 var(--texto);padding:0 .08em}
.paquete .precio{font:400 17px/1 var(--texto);font-variant-numeric:tabular-nums;white-space:nowrap}
.paquete .que{font:400 14.5px/1.5 var(--texto);color:var(--suave);margin:0;flex:1}
.paquete.suelto{grid-column:1/-1;padding:18px 64px 20px 16px}
.paquete.suelto .cuerpo{padding:0}
.paquete.suelto .radio{top:20px;right:20px}
.ejemplo{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);grid-template-rows:auto auto 1fr;grid-template-areas:"v t" "v n" "v l";column-gap:clamp(24px,4vw,64px);align-items:start;margin-top:56px;padding-top:44px;border-top:1px solid var(--linea)}
.ejemplo > h2{grid-area:t}
.ejemplo > .visor{grid-area:v}
.ejemplo > .lista{grid-area:l}
.lienzo{position:relative;display:grid;aspect-ratio:3/2;overflow:hidden;border-radius:2px;background:var(--campo)}
.lienzo img{min-height:0}
.lam-logo{grid-template-rows:minmax(0,1fr) auto;background:var(--verde)}
.lam-logo .gran{display:grid;place-items:center;padding-top:2%}
.lam-logo .gran svg{display:block;width:27%;min-width:150px;height:auto}
.lam-logo .cuadros{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.lam-logo .cq{display:grid;justify-items:center;align-content:center;gap:14px;padding:22px 8px 16px;background:var(--verde2);font:400 12px/1 var(--texto);color:#C9C2B0;font-variant-numeric:tabular-nums}
.lam-logo .cq svg{display:block;width:min(124px,62%);height:auto}
.et-1 .linea,.et-1 .palabra,.et-2 .palabra,.et-3 .palabra{visibility:hidden}
.et-2 .linea path{stroke-dasharray:1 2;stroke-dashoffset:.46}
.et-2 .linea path:nth-child(n+2){visibility:hidden}
.lam-ver{grid-template-columns:repeat(3,minmax(0,1fr))}
.lam-ver .vr{position:relative;display:grid;place-items:center;min-width:0;padding-bottom:6%}
.lam-ver .vr svg{display:block;width:48%;height:auto}
.lam-ver .vr.claro{background:var(--marfil);color:var(--negro);box-shadow:inset 0 0 0 1px var(--borde)}
.lam-ver .vr.negro{background:var(--negro);color:var(--marfil)}
